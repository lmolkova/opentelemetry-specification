groups:
  - id: messaging.message
    prefix: messaging
    type: span #todo - this is an attribute group, not a span.
    brief: 'Semantic convention describing per-message attributes populated on messaging spans or links.'
    attributes:
      - id: destination.name
        type: string
        brief: 'The message destination name'
        note: |
          The destination name SHOULD uniquely identify a queue, topic, or other entity within a broker. If
          the broker does not have such notion, the destination name SHOULD uniquely identify the broker.
          If the destination name is the same for all messages being published, 
          it MUST be set on corresponding publish, receive, process or other span.
        examples: ['MyQueue', 'MyTopic']
      - id: source.name
        type: string
        requirement_level:
          conditionally_required: When available and the same for all messages being sent.
        brief: 'A string identifying queue, topic, or other entity name within broker or globally'
        examples: ['MyQueue', 'MyTopic']
        note: | 
          The source name defines the name of the source of a message, as
          specified by the consumer. There are different kinds of sources, varying
          between message brokers, e. g. queues in RabbitMQ or topics in
          Kafka.

          This attributes is required for consumer spans modelling `deliver`, `receive`,
          or `settle` operations. The name of the source a message is received from can
          be different from the name of the destination a message was sent to.    

          If messages in a batch have different `messaging.source.name`, it MUST
          be populated on each corresponding link to message context. Otherwise it MUST be populated on 
          consumer span.         
      - id: message.id
        type: string
        brief: 'A value used by the messaging system as an identifier for the message, represented as a string.'
        examples: '452a7c7c7c7048c2f887f61572b18fc2'
        requirement_level:
          conditionally_required: if available
      - id: message.conversation_id
        type: string
        brief: >
          The [conversation ID](#conversations) identifying the conversation to which the message belongs,
          represented as a string. Sometimes called "Correlation ID".
        examples: 'MyConversationId'
        requirement_level:
          conditionally_required: if available
      - id: message.payload_size_bytes
        type: int
        brief: >
          The (uncompressed) size of the message payload in bytes.
          Also use this attribute if it is unknown whether the compressed or uncompressed payload size is reported.
        examples: 2738
      - id: message.payload_compressed_size_bytes
        type: int
        brief: 'The compressed size of the message payload in bytes.'
        examples: 2048

  - id: messaging
    prefix: messaging
    type: span
    brief: >
        This document defines the attributes used in messaging systems.
    attributes:
      - id: system
        type: string
        requirement_level: required
        brief: 'A string identifying the messaging system.'
        examples: ['kafka', 'rabbitmq', 'rocketmq', 'activemq', 'AmazonSQS']
        note: |        
              A string identifying the messaging broker or intermediary, e. g. `kafka`,
              `rabbitmq`, `rocketmq`, `AzureEventHubs`, or `AmazonSQS`.

              If the messaging broker or intermediary are not known, this should be set to a
              value that best identifies the usage scenario. This could be the messaging
              library used (e. g. `jms`), or the protocol used (e. g. `amqp`).

              A list of recommended values will be provided independently of the messaging
              semantic conventions document.
      - id: operation
        requirement_level: required
        brief: 'This attribute should be set to one of the [pre-defined operation names](#operation-names).'
        type:
          allow_custom_values: true
          members:
            - id: publish
              value: 'publish'
              brief: One ore more messages are provided for publishing to an intermediary.'
            - id: create
              value: 'create'
              brief: 'A message is created.'
            - id: receive
              value: 'receive'
              brief: 'One or more messages are requested by a consumer.'
            - id: deliver
              value: 'deliver'
              brief: 'One or more message are passed to a consumer.'
            - id: settle
              value: 'settle'
              brief: 'One or more message are settled.'
      - ref: net.peer.name
        note: >
          This should be the IP/hostname of the broker (or other network-level peer) this specific message is sent to/received from.
        requirement_level:
          conditionally_required: If available.
      - ref: net.sock.peer.addr
        tag: connection-level
      - ref: net.sock.peer.port
        tag: connection-level
      - ref: net.sock.family
        tag: connection-level
      - ref: net.sock.peer.name
        tag: connection-level
        requirement_level:
          recommended: If different than `net.peer.name` and if `net.sock.peer.addr` is set.
      - id: batch.size
        type: int
        brief: The number of messages sent, received, or processed in the scope of the batching operation.
        requirement_level:
          conditionally_required: >
            If available within the messaging system, and only if the span describes operations that involve a batch of messages.
        note: >
            Instrumentation SHOULD always set it on batch `receive` operations regardless
            of the actual number of received messages (e.g. 0, 1, or more).
        examples: [0, 1, 2]

  - id: messaging.create_and_publish
    prefix: messaging
    type: span
    extends: messaging
    span_kind: producer
    brief: Semantic convention for producers of messages sent to a messaging systems.
    attributes:
      - ref: messaging.destination.name
        requirement_level:
          conditionally_required: if available and the same for all messages being sent.
      - id: destination.kind
        type:
          allow_custom_values: true
          members:
            - id: queue
              value: "queue"
              brief: "A message sent to a queue"
            - id: topic
              value: "topic"
              brief: "A message sent to a topic"
        requirement_level:
          conditionally_required: If the message destination is either a `queue` or `topic`.
        brief: 'The kind of message destination'
        note: | 
          Different brokers have different concepts of message destinations, the most
          popular being queues and topics. One of the most important differences in
          destination kinds is how messages are settled: messages are settled
          individually in queues, whereas messages are settled based on checkpoints in
          topics. Individual brokers might specify additional destination kinds.
      - id: destination.template
        type: string
        requirement_level:
          conditionally_required: when available
        brief: 'Low cardinality field representing messaging destination'
        examples: ['/customers/{customerId}']
        note: | 
          In some instances, message destination names are constructed from templates. An
          example would be a destination name involving a user name or product id.
          Although the destination name in this case is of high cardinality, the
          underlying template is of low cardinality and can be effectively used for
          grouping and searching spans.

          This attribute is optional, but recommended if the destination name is created
          based on such a template.
      - id: destination.temporary
        type: boolean
        requirement_level:
          recommended: when supported by messaging system and only if the destination is temporary. If missing, assumed to be false.
        brief: 'denotes that the destination is a temporary destination and might not exist anymore after messages are processed'
      - id: destination.anonymous
        type: boolean
        requirement_level:
          recommended: when supported by messaging system and only if the destination is anonymous. If missing, assumed to be false.
        brief: 'denotes that the destination is an anonymous destination (could be unnamed or have auto-generated name)'
        note: |
          If set to `true`, this flag denotes that the destination is a temporary
          destination and might not exist anymore after messages are processed.
      - ref: messaging.message.id
      - ref: messaging.message.conversation_id
      - ref: messaging.message.payload_size_bytes
      - ref: messaging.message.payload_compressed_size_bytes
    constraints:
      - include: network

  - id: messaging.receive
    prefix: messaging
    type: span
    extends: messaging
    span_kind: consumer
    brief: 'Semantic convention for a consumer of messages received from a messaging system'
    attributes:
      - ref: messaging.source.name
        type: string
        requirement_level:
          conditionally_required: if available and the same for all messages being received.
      - id: source.kind
        type:
          allow_custom_values: true
          members:
            - id: queue
              value: "queue"
              brief: "A message sent to a queue"
            - id: topic
              value: "topic"
              brief: "A message sent to a topic"
        requirement_level:
          conditionally_required: If the message destination is either a `queue` or `topic`.
        brief: 'The kind of message destination'
      - id: source.template
        type: string
        requirement_level:
          conditionally_required: when available
        brief: 'Low cardinality field representing messaging destination'
        examples: ['/customers/{customerId}']
      - id: source.temporary
        type: boolean
        requirement_level:
          recommended: when supported by messaging system and only if the source is temporary. If missing, assumed to be false.
        brief: 'denotes that the source is a temporary source and might not exist anymore after messages are processed'
      - id: source.anonymous
        type: boolean
        requirement_level:
          recommended: when supported by messaging system and only if the destination is anonymous. If missing, assumed to be false.
        brief: 'denotes that the source is an anonymous source (could be unnamed or have auto-generated name)'
      - id: consumer_id
        type: string
        brief: >
          The identifier for the consumer receiving a message. For Kafka, set it to
          `{messaging.kafka.consumer_group} - {messaging.kafka.client_id}`, if both are present, or only
          `messaging.kafka.consumer_group`. For brokers, such as RabbitMQ and Artemis, set it to the `client_id`
          of the client consuming the message.
        examples: 'mygroup - client-6'
      - ref: messaging.message.id
      - ref: messaging.message.correlation_id
      - ref: messaging.message.payload_size_bytes
      - ref: messaging.message.payload_compressed_size_bytes

  - id: messaging.deliver
    prefix: messaging
    type: span
    extends: messaging.consumer
    span_kind: consumer
    brief: >
      Semantic convention for servers that consume messages received from messaging systems
      and always send back replies directed to the producers of these messages.

  - id: messaging.consumer.settle.message
    prefix: messaging
    type: span
    extends: messaging.receive
    span_kind: internal
    brief: 'Semantic convention for settling individual message'
    attributes:
      - id: settlement_type_todo
        type: string
        brief: 'Settlement operation'
        requirement_level: 
          conditionally_required: if supported by messaging system.
        examples: ['complete', 'abandon', 'defer']

  - id: messaging.consumer.settle.offset
    prefix: messaging
    type: span
    extends: messaging.receive
    span_kind: internal
    brief: 'Semantic convention for settling by offset'
    attributes:
      - id: offset_todo
        type: int
        brief: 'Offset'
        requirement_level: required