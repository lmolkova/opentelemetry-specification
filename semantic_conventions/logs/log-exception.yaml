groups:
  - id: log-exception
    type: attribute_group
    prefix: exception
    brief: >
      This document defines attributes for exceptions represented using Log
      Records.
    attributes:
      - ref: error.type
      - ref: error.message
      - ref: error.stack_trace

    constraints:
      - any_of:
          - "error.type"
          - "error.message"
